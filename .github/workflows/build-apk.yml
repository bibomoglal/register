name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      # With a committed package-lock.json the exact versions are used (npm ci); without it the first run creates one.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm ls --depth=0 || true
      - name: Save resolved package-lock.json (commit it to pin versions)
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: ignore
      - run: npx cap add android

      - name: Allow HTTP to the router
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q usesCleartextTraffic "$M" || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$M"
          grep -n usesCleartextTraffic "$M"
      - name: Add MainActivity (keeps traffic on Wi-Fi)
        run: |
          D=android/app/src/main/java/io/github/bibomoglal/brightstarwifi
          ls "$D"
          cp native/MainActivity.java "$D"/
      - name: Network permissions
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n    <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" \/>\n    <application/' android/app/src/main/AndroidManifest.xml
          grep -n "NETWORK_STATE" android/app/src/main/AndroidManifest.xml
      - name: Set app icon
        run: |
          pip install pillow
          python3 make_icons.py
          find android/app/src/main/res -name "ic_launcher*"
      - name: Set version (versionName from package.json, versionCode = run number)
        run: |
          VN=$(node -p "require('./package.json').version")
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]*\"/versionName \"${VN}\"/" "$G"
          grep -nE "versionCode|versionName" "$G"
          grep -q "versionCode ${GITHUB_RUN_NUMBER}" "$G" || { echo "::error::could not set versionCode in $G"; exit 1; }
      - run: npx cap sync android

      - name: Build and sign APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p dist
          cd android
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            ./gradlew assembleRelease
            cd ..
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            export KEY_PASS="${KEY_PASS:-$KS_PASS}"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --key-pass env:KEY_PASS --ks-key-alias "$KS_ALIAS" --out dist/BrightStarWiFi.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify --print-certs dist/BrightStarWiFi.apk
            rm -f "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::Signing secrets are missing, so this is a debug APK signed with a random key. Updates will NOT install over the previous version. See SIGNING.md."
            ./gradlew assembleDebug
            cd ..
            cp android/app/build/outputs/apk/debug/app-debug.apk dist/BrightStarWiFi.apk
          fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: BrightStarWiFi-apk
          path: dist/BrightStarWiFi.apk
